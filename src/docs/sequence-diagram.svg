  .head { fill: #EEF4FB; stroke: #333; stroke-width: 1.3; }
  .life { stroke: #888; stroke-dasharray: 6 5; }
  .msg { stroke: #333; stroke-width: 1.3; }
  .ret { stroke: #333; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .frame { fill: rgba(240, 240, 240, 0.35); stroke: #555; stroke-width: 1.2; }
  .tag { fill: #FFF8E1; stroke: #555; }
  .ftag { font-size: 12px; font-weight: bold; }
  .note { fill: #FFFDE7; stroke: #C9B458; }
</style>
